name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        name: tcp-hop spike
        shell: bash
        run: |
          {
            echo "## tcp-hop spike (ADR 0002)"
            ./target/${{ matrix.target }}/release/tcp-hop.exe 1.1.1.1 443 15
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: size budget (ADR 0007)
        shell: bash
        run: |
          size=$(stat -c %s target/${{ matrix.target }}/release/blinkengraphs.exe)
          echo "blinkengraphs.exe (${{ matrix.target }}): $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le 7340032
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        name: footprint
        shell: bash
        run: |
          {
            echo "## Footprint (60 s, default config, Panel closed)"
            cargo run -q --release -p footprint -- 60 target/x86_64-pc-windows-msvc/release/blinkengraphs.exe
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo run --release -p screenshots -- out
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blinkengraphs-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/blinkengraphs.exe
            target/${{ matrix.target }}/release/tcp-hop.exe

  screenshots:
    needs: windows
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: screenshots
          path: out
      - name: Push to ci-screenshots branch
        id: push
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git init -q pub && cd pub
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q --depth 1 origin ci-screenshots && git checkout -q FETCH_HEAD || git checkout -q --orphan ci-screenshots
          mkdir -p "$SHA" && cp ../out/*.png "$SHA/"
          git add "$SHA"
          if [ "${{ github.event_name }}" = push ]; then
            rm -rf main && mkdir main && cp ../out/*.png main/ && git add -A main
          fi
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "screenshots $SHA"
          git push -q origin HEAD:ci-screenshots
          prefix="https://raw.githubusercontent.com/${{ github.repository }}/ci-screenshots/$SHA/"
          sed "s#](\([^)]*\.png\))#](${prefix}\1)#" ../out/index.md > ../index.md
          { echo "## Screenshots"; cat ../index.md; } >> "$GITHUB_STEP_SUMMARY"
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const marker = '<!-- blinkengraphs-screenshots -->';
            const body = `${marker}\n## Screenshots (${context.payload.pull_request.head.sha.slice(0, 7)})\n\n` +
              require('fs').readFileSync('index.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
