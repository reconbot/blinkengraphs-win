name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The spec's generated files come from this code, so conformance is: regenerate, then expect no diff.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: pin
        run: echo "ref=$(cat SPEC_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: reconbot/blinkengraphs
          ref: ${{ steps.pin.outputs.ref }}
          path: spec
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo run -p vectors -- generated
      - name: conforms to spec ${{ steps.pin.outputs.ref }}
        run: |
          for p in vectors fixtures tokens defaults.json; do
            diff -ru "spec/$p" "generated/$p"
          done

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo test --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        name: tcp-hop spike
        shell: bash
        run: |
          {
            echo "## tcp-hop spike (ADR 0002)"
            ./target/${{ matrix.target }}/release/tcp-hop.exe 1.1.1.1 443 15
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        name: MSI builds (ADR 0010)
        shell: bash
        run: installer/build.sh x64 target/${{ matrix.target }}/release/blinkengraphs.exe dist
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        name: MSI installs per-user, then uninstalls
        shell: pwsh
        run: |
          $msi = (Resolve-Path dist/blinkengraphs-x64.msi).Path
          function Msi($argv) {
            $p = Start-Process msiexec -ArgumentList $argv -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 60 -ErrorAction SilentlyContinue; throw "msiexec $argv exited $($p.ExitCode)" }
          }
          Msi "/i `"$msi`" /qn /l*v install.log MSIINSTALLPERUSER=1 ALLUSERS=2"
          $exe = "$env:LOCALAPPDATA\Programs\blinkengraphs\blinkengraphs.exe"
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 60; throw "missing $exe" }
          $run = Get-ItemPropertyValue 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name blinkengraphs
          Write-Host "Run key: $run"
          Msi "/x `"$msi`" /qn"
          if (Test-Path $exe) { throw "uninstall left $exe" }
          "MSI: $((Get-Item $msi).Length) bytes; per-user install and uninstall OK" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - name: size budget (ADR 0007)
        shell: bash
        run: |
          size=$(stat -c %s target/${{ matrix.target }}/release/blinkengraphs.exe)
          echo "blinkengraphs.exe (${{ matrix.target }}): $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le 7340032
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        name: footprint
        shell: bash
        run: |
          {
            echo "## Footprint (60 s, default config, Panel closed)"
            cargo run -q --release -p footprint -- 60 target/x86_64-pc-windows-msvc/release/blinkengraphs.exe
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: blinkengraphs-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/blinkengraphs.exe
            target/${{ matrix.target }}/release/tcp-hop.exe

