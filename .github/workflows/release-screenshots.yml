name: release-screenshots
# release.yml calls this after publishing: a release created with GITHUB_TOKEN fires no
# `release` event (https://docs.github.com/en/actions/using-workflows/triggering-a-workflow#triggering-a-workflow-from-a-workflow).
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to annotate
        required: true

concurrency:
  group: release-screenshots-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Append screenshots for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          # The screenshots workflow renders the same commit in parallel; give it 15 minutes.
          for _ in $(seq 90); do
            gh api "repos/$GH_REPO/contents/$sha?ref=ci-screenshots" --silent 2>/dev/null && break
            sleep 10
          done
          gh api "repos/$GH_REPO/contents/$sha?ref=ci-screenshots" --jq '[.[].name | select(endswith(".png"))]' > names.json
          gh release view "$TAG" --json body --jq .body > body.md
          # Every screenshot of the commit, grouped by kind; a re-run replaces the section.
          python3 - "$sha" > notes.md <<'PY'
          import json, os, sys
          sha = sys.argv[1]
          raw = f"https://raw.githubusercontent.com/{os.environ['GH_REPO']}/ci-screenshots/{sha}"
          body = open("body.md").read().split("<!-- screenshots -->")[0].rstrip()
          names = sorted(json.load(open("names.json")))
          caption = lambda n, prefix: n.removeprefix(prefix).removesuffix(".png").replace("-", " ")
          out = [body, "", "<!-- screenshots -->", "## Screenshots", "",
                 f"Rendered by CI from fixture data at `{sha[:7]}`.", ""]
          panels = [n for n in names if n.startswith("panel-")]
          if panels:
              out += ["### Panel", "", "<table>"]
              for row in range(0, len(panels), 3):
                  out += ["<tr>"] + [f'<td align="center" valign="top"><img src="{raw}/{n}" width="260"><br><sub>{caption(n, "panel-")}</sub></td>' for n in panels[row:row + 3]] + ["</tr>"]
              out += ["</table>", ""]
          strips = [n for n in names if n.startswith("strip-")]
          if strips:
              out += ["### Taskbar Strip", ""]
              for n in strips:
                  out += [f"**{caption(n, 'strip-')}**", "", f"![{n}]({raw}/{n})", ""]
          rest = [n for n in names if not n.startswith(("panel-", "strip-"))]
          for n in rest:
              out += [f"### {caption(n, '').capitalize()}", "", f"![{n}]({raw}/{n})", ""]
          print("\n".join(out))
          PY
          gh release edit "$TAG" --notes-file notes.md
