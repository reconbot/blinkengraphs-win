name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and upload exes to
        required: true

# Never cancel: a cancelled run can leave a release without its exes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write
  attestations: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp

  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          submodules: true
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p blinkengraphs
      - shell: bash
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/blinkengraphs.exe dist/blinkengraphs-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/

  publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # Attestations need a public repository on user-owned accounts.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.exe
      - name: Rolling main-latest prerelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f main-latest "$GITHUB_SHA"
          git push -f origin refs/tags/main-latest
          gh release view main-latest >/dev/null 2>&1 || gh release create main-latest --prerelease \
            --title "main (rolling)" --notes "Latest build of main. Unsigned; verify with: gh attestation verify <exe> -R ${{ github.repository }}"
          gh release edit main-latest --target "$GITHUB_SHA"
          gh release upload main-latest dist/*.exe --clobber
      - if: needs.release-please.outputs.created == 'true' || inputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" dist/*.exe --clobber

  screenshots:
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' && (needs.release-please.outputs.created == 'true' || inputs.tag) }}
    uses: ./.github/workflows/release-screenshots.yml
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag }}
