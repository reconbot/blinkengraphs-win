[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "spikes/*", "app"]

[workspace.package]
version = "2.0.0" # x-release-please-version
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
model = { path = "crates/model" }
render = { path = "crates/render" }
palette = { path = "crates/palette" }
fixtures = { path = "crates/fixtures" }
config = { path = "crates/config" }
history = { path = "crates/history" }
verdict = { path = "crates/verdict" }
collect = { path = "crates/collect" }
probe = { path = "crates/probe" }
panel = { path = "crates/panel" }
meters = { path = "crates/meters" }
engine = { path = "crates/engine" }
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
